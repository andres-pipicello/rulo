[tools]
node = "24.22.1"
pnpm = "12.15.0"
lefthook = "2.2.2"

[tasks.install]
run = "pnpm install --frozen-lockfile"

[tasks.dev]
run = "pnpm vite"

[tasks.build]
run = "pnpm vite build"

[tasks.lint]
run = "pnpm eslint . --max-warnings 0"

[tasks.format]
run = "pnpm prettier --write ."

[tasks."format:check"]
run = "pnpm prettier --check ."

[tasks.typecheck]
run = "pnpm tsc -b"

[tasks.test]
run = "pnpm vitest run"

[tasks.e2e]
run = "pnpm playwright test"

[tasks.check]
description = "Everything the pre-commit hook and CI require"
depends = ["format:check", "lint", "typecheck", "test"]
