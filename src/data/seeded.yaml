# Seeded Market Data: values for Platforms whose Fees or Exchange Rates are declared seeded in
# catalog.yaml. Illustrative only: these are NOT real Fees. Every Endpoint of a Platform with seeded
# Fees needs an entry; a free one is an explicit zero.

rates: []

# flat: Minor Units of the charged Currency; proportional: fraction below 1
